<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Placar colorido</title>
  <!-- Primeiro os tokens da emissora, depois o estilo do placar. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sb">
    <div class="sb-league">VL</div>
    <div class="sb-team sb-home">MER</div>

    </div>
