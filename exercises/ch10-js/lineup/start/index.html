<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escalação</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Pronto: o estilo da escalação. O exercício é o script.js. */
    body { margin: 0; font-family: var(--font-data); }

    /* O quadro de 1920 × 1080, com a escalação no centro. */
    .stage { width: 1920px; height: 1080px; display: grid; place-items: center; }
    .lu { width: 520px; filter: var(--shadow); }

    /* Cada placa inclina só o fundo (::before); o texto fica reto. */
    .lu-kicker, .lu-team, .lu-list li { position: relative; isolation: isolate; display: flex; align-items: center; }
    .lu-kicker::before, .lu-team::before, .lu-list li::before {
      content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(var(--skew)); background: var(--ink);
    }
    .lu-kicker { width: fit-content; height: var(--h-strip); padding: 0 26px; margin-left: 26px;
                 font-size: var(--size-label); font-weight: 700; letter-spacing: var(--track-label); color: var(--on-accent); }
    .lu-kicker::before { background: var(--accent); }
    .lu-team { height: var(--h-bar); padding: 0 34px; margin-bottom: 8px;
               font: var(--size-display) var(--font-display); letter-spacing: .015em; color: var(--paper); }
    .lu-team::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--blade);
                      background: var(--accent); transform: skewX(var(--skew)); }

    .lu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .lu-list li { height: var(--h-strip); gap: 14px; padding: 0 34px;
                  font-size: var(--size-data); font-weight: 600; letter-spacing: var(--track-data);
                  text-transform: uppercase; color: var(--paper); }
    .lu-list li::before { background: var(--ink-2); }
    .lu-number { width: 1.4em; font: var(--size-data-l) var(--font-display); color: var(--accent);
                 font-variant-numeric: tabular-nums; }
    .lu-list .lu-keeper::before { background: var(--primary); }

    /* Os botões ficam abaixo do quadro: não aparecem no ar. */
    .controls { display: flex; gap: 12px; padding: 24px var(--safe-x); }
    .controls button { font: 600 var(--size-data) var(--font-data); padding: 8px 18px; }
  </style>
</head>
<body>

  <div class="stage">
    <div class="lu">
      <div class="lu-kicker">ESCALAÇÃO</div>
      <div class="lu-team">CD MERIDIAN</div>
      <ol class="lu-list"></ol>
    </div>
  </div>

  <div class="controls">
    <button id="all">Todos</button>
    <button id="defense">Só a defesa</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
