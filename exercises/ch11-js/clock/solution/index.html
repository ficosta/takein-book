<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relógio</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* O quadro: 1920 × 1080, fundo transparente. */
    body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }

    /* O relógio: canto de cima, à direita da área de título. */
    .clock {
      position: absolute; right: var(--safe-x); top: var(--safe-y);
      height: var(--h-plate); display: flex; filter: var(--shadow);
    }
    .date, .time {
      position: relative; z-index: 0;
      display: flex; align-items: center; padding: 0 24px;
    }
    /* A placa inclinada é desenhada no ::before, atrás do texto.
     * Assim o texto fica reto e o JavaScript escreve direto nele. */
    .date::before, .time::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      transform: skewX(var(--skew)); transform-origin: right top;
    }
    .date {
      color: var(--dim); font: 600 var(--size-data) var(--font-data);
      letter-spacing: var(--track-data); text-transform: uppercase;
    }
    .date::before { background: var(--ink-2); }
    .time {
      color: var(--paper); font: var(--size-score) var(--font-display);
      letter-spacing: 0.03em; font-variant-numeric: tabular-nums;
    }
    .time::before { background: var(--ink); border-left: var(--blade) solid var(--accent); }
  </style>
</head>
<body>
  <div class="clock">
    <div class="date"></div>
    <div class="time"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
