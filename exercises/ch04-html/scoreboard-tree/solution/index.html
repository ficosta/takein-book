<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Árvore do placar</title>
</head>
<body>

  <!-- Uma solução possível. Os nomes podem ser outros:
       o que importa é a hierarquia. -->

  <div class="sb">
    <div class="sb-league">VL</div>
    <div class="sb-team sb-home">MER</div>
    <div class="sb-score">
      <span class="sb-goals sb-home">2</span>
      <span class="sb-colon">:</span>
      <span class="sb-goals sb-away">1</span>
    </div>
    <div class="sb-team sb-away">ATL</div>
    <div class="sb-clock">
      <span class="sb-period">2T</span>
      <span class="sb-time">67:46</span>
    </div>
  </div>

</body>
</html>
