<!DOCTYPE html>
<html lang="pt-BR" data-skin="news">
<head>
  <meta charset="UTF-8">
  <title>Ache o erro</title>
  <!-- Não mexa no head. O estilo abaixo só pinta cada linha de
       um jeito, para você ver na hora se ela está certa.
       O CSS é o assunto do capítulo 5. -->
  <link rel="stylesheet" href="tokens.css">
  <style>
    body      { margin: 0; width: 1920px; height: 1080px; font-family: var(--font-data); }
    .lt       { position: absolute; left: var(--safe-x); bottom: var(--bottom-y); }
    .lt-name  { display: flex; align-items: center; height: var(--h-bar); padding: 0 34px;
                background: var(--ink); color: var(--paper);
                font: var(--size-display) var(--font-display); letter-spacing: 0.015em; }
    .lt-role  { display: flex; align-items: center; height: var(--h-strip); padding: 0 26px;
                background: var(--accent); color: var(--on-accent);
                font-size: var(--size-label); font-weight: 700; letter-spacing: var(--track-label); }
    .lt-place { display: flex; align-items: center; height: var(--h-strip); padding: 0 26px;
                background: var(--primary); color: var(--paper);
                font-size: var(--size-data); font-weight: 600; letter-spacing: var(--track-data); }
    .lt-live  { position: fixed; right: var(--safe-x); top: var(--safe-y);
                display: flex; align-items: center; height: var(--h-plate); padding: 0 22px;
                background: var(--live); color: var(--paper);
                font-size: var(--size-data); font-weight: 700; letter-spacing: var(--track-label); }
  </style>
</head>
<body>

  <!-- Este arquivo tem QUATRO erros. Deveria aparecer:

         embaixo, à esquerda, empilhados:
           ANA SOUZA      (placa escura, letra grande)
           REPÓRTER       (faixa amarela)
           SÃO PAULO      (faixa azul)
         em cima, à direita:
           AO VIVO        (placa vermelha)

       Abra no Chrome, compare e use o DevTools. -->

  <div class="lt">
    <div class="lt-name">ANA SOUZA
    <div clas="lt-role">REPÓRTER</div>
    <div class="lt place">SÃO PAULO</div>
    <!-- selo de ao vivo -
    <div class="lt-live">AO VIVO</div>
  </div>

</body>
</html>
