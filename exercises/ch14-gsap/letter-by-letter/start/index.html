<!DOCTYPE html>
<html lang="pt-BR" data-skin="news">
<head>
  <meta charset="UTF-8">
  <title>Letra por letra</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; font-family: var(--font-data); }

    /* O quadro de 1920 × 1080. A tarja fica na linha de baixo. */
    .stage { position: relative; width: 1920px; height: 1080px; }
    .strap { position: absolute; left: var(--safe-x); bottom: var(--bottom-y); filter: var(--shadow); }

    /* A placa inclina só o fundo (::before); o texto fica reto. */
    .strap-bar { position: relative; isolation: isolate; display: flex; align-items: center;
                 height: var(--h-bar); padding: 0 48px 0 34px; }
    .strap-bar::before { content: ""; position: absolute; inset: 0; z-index: -1;
                         transform: skewX(var(--skew)); background: var(--ink); }
    .strap-bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--blade);
                        transform: skewX(var(--skew)); background: var(--live); }
    .strap-title { font: var(--size-display)/1.15 var(--font-display); letter-spacing: .015em;
                   color: var(--paper); white-space: nowrap; }

    /* Os botões ficam abaixo do quadro: não aparecem no ar. */
    .controls { display: flex; gap: 12px; padding: 24px var(--safe-x); }
    .controls button { font: 600 var(--size-data) var(--font-data); padding: 8px 18px; }
  </style>
</head>
<body>

  <div class="stage">
    <div class="strap">
      <div class="strap-bar"><div class="strap-title">ÚLTIMA HORA</div></div>
    </div>
  </div>

  <div class="controls">
    <button id="replay">Repetir</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
